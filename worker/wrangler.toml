# Review reminders for the hosted app. CI deploys it (.github/workflows/push-worker.yml).
name = "catechize-push"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Every 30 minutes, so a time zone with a half-hour offset still gets its hour.
[triggers]
crons = ["*/30 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://catechize.pages.dev"
VAPID_SUBJECT = "https://catechize.pages.dev"
# VAPID_PUBLIC_KEY is set by CI from the repository variable of the same name.
# VAPID_PRIVATE_KEY is a secret: CI sets it from the repository secret.

[[d1_databases]]
binding = "DB"
database_name = "catechize-push"
database_id = "REPLACED_BY_CI"
