name: Deploy to Cloudflare Pages

# Production: after the Website workflow passes on main, deploy the exact
# site/out artifact it built. Nothing is rebuilt here.
on:
  workflow_run:
    workflows: [Website]
    branches: [main]
    types: [completed]

concurrency:
  group: catechize-pages-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write

env:
  PROJECT: catechize

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.project.outputs.url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make sure the Pages project exists
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          status="$(curl --silent --output project.json --write-out '%{http_code}' --header "$auth" "$api/$PROJECT")"
          if [ "$status" = 404 ]; then
            curl --fail --silent --show-error --request POST --header "$auth" \
              --header 'Content-Type: application/json' \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" \
              --output project.json "$api"
          elif [ "$status" != 200 ]; then
            echo "Cloudflare project lookup returned $status" >&2
            cat project.json >&2
            exit 1
          fi
          # Pages adds a suffix when the name is taken, so read the real subdomain.
          echo "url=https://$(jq -r .result.subdomain project.json)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ env.PROJECT }}
            --branch=main
            --commit-hash=${{ github.event.workflow_run.head_sha }}

      # The homepage, the app, the data and the guide must all answer.
      - name: Check the live site
        env:
          URL: ${{ steps.project.outputs.url }}
        run: |
          check() {
            for _ in $(seq 1 20); do
              if curl --fail --silent --show-error "$URL$1" | grep -q "$2"; then
                echo "ok  $1"
                return 0
              fi
              sleep 3
            done
            echo "FAIL $1 (expected \"$2\")" >&2
            return 1
          }
          check / 'Learn the catechism by heart'
          check /app/ 'Catechize'
          check /app/data/index.json '"lsc"'
          check /docs/self-hosting/ 'Self-hosting'
