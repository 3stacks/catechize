name: Website

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - run: npm ci
      - run: npm ci --prefix site
      - run: npm test
      - run: npm --prefix site run lint
      - run: npm run site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/out
